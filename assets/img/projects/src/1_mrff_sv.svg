<svg xmlns="http://www.w3.org/2000/svg" width="600" height="768" viewBox="0 0 600 768"><rect width="600" height="768" fill="#fff"/><text x="20" y="40" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#222" text-anchor="start" font-weight="bold">From reads to candidate SVs</text><rect x="40" y="70" width="520" height="82" rx="12" fill="#eef2f6" stroke="#8a96a3" stroke-width="2.5"/><text x="300" y="108" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">103 genomes, raw reads on</text><text x="300" y="136" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">the university data store</text><line x1="300" y1="156" x2="300" y2="182" stroke="#555" stroke-width="3"/><polygon points="290,178 310,178 300,192" fill="#555"/><rect x="40" y="198" width="520" height="110" rx="12" fill="#e6eef8" stroke="#2f6db3" stroke-width="2.5"/><text x="300" y="236" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">Re-align to GRCh38 + decoy</text><text x="300" y="264" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">GPU Parabricks: NCI Gadi</text><text x="300" y="292" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">and the lab GPU server</text><line x1="300" y1="312" x2="300" y2="338" stroke="#555" stroke-width="3"/><polygon points="290,334 310,334 300,348" fill="#555"/><rect x="40" y="354" width="520" height="110" rx="12" fill="#e8f4f1" stroke="#1b8a7a" stroke-width="2.5"/><text x="300" y="392" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">SV calling: Manta, smoove,</text><text x="300" y="420" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">TIDDIT; merge with SURVIVOR;</text><text x="300" y="448" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">annotate with AnnotSV</text><line x1="300" y1="468" x2="300" y2="494" stroke="#555" stroke-width="3"/><polygon points="290,490 310,490 300,504" fill="#555"/><rect x="40" y="510" width="520" height="110" rx="12" fill="#fbf0e2" stroke="#e39b2d" stroke-width="2.5"/><text x="300" y="548" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">Filter to 356 neuropathy</text><text x="300" y="576" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">genes; PMP22 read-depth</text><text x="300" y="604" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">check (CMT1A / HNPP)</text><line x1="300" y1="624" x2="300" y2="650" stroke="#555" stroke-width="3"/><polygon points="290,646 310,646 300,660" fill="#555"/><rect x="40" y="666" width="520" height="82" rx="12" fill="#eef2f6" stroke="#8a96a3" stroke-width="2.5"/><text x="300" y="704" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">Results back to the data</text><text x="300" y="732" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#222" text-anchor="middle">store, checked by md5</text></svg>