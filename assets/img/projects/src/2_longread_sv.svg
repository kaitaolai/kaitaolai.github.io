<text x="20" y="423" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#333">read fits). None spans the repeat, so its</text>
<text x="20" y="451" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#333">length and contents stay unknown.</text>
